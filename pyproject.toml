[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loenn-mcp"
version = "7.2.0"
description = "Celeste map editor for AI agents — MCP server for reading, editing, previewing, and procedurally generating .bin map files"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Maggy Studio" }]
keywords = ["celeste", "loenn", "mcp", "model-context-protocol", "game-modding", "everest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.9"
dependencies = [
    "fastmcp>=3.4.0,<4",
]

[project.optional-dependencies]
image = ["Pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/Maggy-Studio/loenn-mcp"
Repository = "https://github.com/Maggy-Studio/loenn-mcp"
Issues = "https://github.com/Maggy-Studio/loenn-mcp/issues"

[project.scripts]
loenn-mcp = "loenn_mcp.server:main"
pcgscene = "loenn_mcp.cli:main"
loenn-json = "loenn_mcp.json_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["loenn_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"js/index.js" = "loenn_mcp/js/index.js"
"js/package.json" = "loenn_mcp/js/package.json"
"js/bin/loenn-author.js" = "loenn_mcp/js/bin/loenn-author.js"

[tool.hatch.build.targets.sdist]
include = [
    "loenn_mcp/",
    "js/",
    "THIRD_PARTY_NOTICES.md",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
