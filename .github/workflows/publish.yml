name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  registry:
    name: Publish to the MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC proves the io.github.Magedeline namespace
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set server.json version from the release tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Wait for PyPI to serve the release
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/loenn-mcp/$VERSION/json" > /dev/null; then
              echo "loenn-mcp $VERSION is on PyPI"; exit 0
            fi
            echo "not yet ($i)"; sleep 10
          done
          echo "loenn-mcp $VERSION never appeared on PyPI"; exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
