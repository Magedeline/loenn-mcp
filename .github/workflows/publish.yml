name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  registry:
    name: Publish to the MCP Registry
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC proves the io.github.Magedeline namespace
      contents: write   # attaches the .mcpb bundle to the release
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the MCPB bundle (uv runtime; the registry entry needs no PyPI release)
        id: bundle
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          python tools/build_mcpb.py --version "$VERSION" --out "dist/loenn-mcp-$VERSION.mcpb" | tee build.log
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(awk '/^sha256/ {print $2}' build.log)" >> "$GITHUB_OUTPUT"

      - name: Attach the bundle to the release
        run: gh release upload "$GITHUB_REF_NAME" "dist/loenn-mcp-${{ steps.bundle.outputs.version }}.mcpb" --clobber

      - name: Point server.json at the attached bundle
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/loenn-mcp-${{ steps.bundle.outputs.version }}.mcpb"
          jq --arg v "${{ steps.bundle.outputs.version }}" --arg url "$URL" --arg sha "${{ steps.bundle.outputs.sha }}" \
             '.version = $v | .packages[0].identifier = $url | .packages[0].fileSha256 = $sha' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
